# Serves the static Vite build. Single-page app with no client-side router yet
# (Beat 2.2), so there is no history-fallback rewrite to configure — that's needed the
# moment routing is added.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
