# beacon-dev — the single kind cluster Acts 1–3 run against (ADR-0004, ADR-0005).
#
# Deliberately minimal: one node that is both control-plane and worker. No
# extraPortMappings yet — the browser and the ingress-nginx controller arrive in
# Beat 2.3; until then the API is reached with `kubectl port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: beacon-dev
nodes:
  - role: control-plane
