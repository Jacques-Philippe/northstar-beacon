apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Stamp app=beacon onto every object (and into selectors) so `kubectl get -l app=beacon`
# returns the Deployment and Service too, not just the Pod and ReplicaSet.
labels:
  - pairs:
      app: beacon
    includeSelectors: true
