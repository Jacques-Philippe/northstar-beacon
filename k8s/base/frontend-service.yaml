# Stable in-cluster address for the frontend Pods. ClusterIP only — reached with
# `kubectl port-forward svc/beacon-frontend` until the Ingress takes over in Beat 2.3.
apiVersion: v1
kind: Service
metadata:
  name: beacon-frontend
spec:
  selector:
    app: beacon
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
