# Routes beacon.dev.local/ to the frontend Service (Beat 2.3). No rewrite-target — see
# ingress-api.yaml for why the /api routing lives in its own Ingress object instead of
# alongside this one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beacon-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: beacon.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beacon-frontend
                port:
                  number: 80
