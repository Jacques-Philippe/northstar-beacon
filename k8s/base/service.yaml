# Stable in-cluster address for the api Pods. ClusterIP only — nothing outside the
# cluster reaches this directly yet; `kubectl port-forward svc/beacon-api` is how you
# hit it during Beat 1.3, and an Ingress takes over in Beat 2.3.
#
# The Service listens on 80 and forwards to the container's named `http` port (8000).
# Three ports in play, deliberately distinct: the Service `port` (80), its `targetPort`
# (the container port), and the port the process binds (8000, from BEACON_PORT).
apiVersion: v1
kind: Service
metadata:
  name: beacon-api
spec:
  selector:
    app: beacon
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
