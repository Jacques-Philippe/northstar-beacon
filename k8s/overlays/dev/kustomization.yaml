apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The immutable git short SHA of the image running in beacon-dev. `make deploy-dev`
# rewrites `newTag` to the current build before applying; from Beat 1.4 on, bumping this
# line (and committing it) is what a deploy *is*. Never `latest`.
images:
  - name: beacon
    newTag: "uncommitted"
