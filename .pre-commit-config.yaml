# Install:  uv run pre-commit install --install-hooks
#           uv run pre-commit install --hook-type pre-push
# Hooks call `uv run ...`, so the pinned versions come from uv.lock — one source of truth
# with CI (.github/workflows/ci.yml).

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --fix
        types: [python]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types: [python]

      - id: pytest
        name: pytest
        language: system
        entry: uv run pytest -q
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
